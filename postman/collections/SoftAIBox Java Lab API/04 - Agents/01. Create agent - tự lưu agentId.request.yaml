$kind: http-request
url: "{{baseUrl}}/api/v1/agent"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Daily Java Coach",
      "description": "Creates Java interview questions",
      "task_prompt": "Create one Java Junior interview question",
      "schedule_type": "DAILY"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Create agent trả 201', function () { pm.response.to.have.status(201); });
      const body = pm.response.json();
      pm.collectionVariables.set('agentId', String(body.data.id));
    language: text/javascript
order: 1000
