$kind: http-request
url: "{{baseUrl}}/api/v1/chat_conversations/{{conversationId}}/chat-status"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status trả 200', function () { pm.response.to.have.status(200); });
      pm.expect(pm.response.json().data.chatStatus).to.eql('completed');
    language: text/javascript
order: 4000
