$kind: http-request
url: "{{baseUrl}}/api/v1/chat"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "message": "Explain dependency injection",
      "conversation_id": {{conversationId}},
      "modelName": "interview-coach"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Chat trả 200', function () { pm.response.to.have.status(200); });
      pm.test('Có câu trả lời', function () {
          pm.expect(pm.response.json().data.response).to.include('dependency injection');
      });
    language: text/javascript
order: 2000
