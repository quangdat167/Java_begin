$kind: http-request
url: "{{baseUrl}}/api/v1/chat_conversations/{{conversationId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Detail trả 200', function () { pm.response.to.have.status(200); });
      pm.test('Đúng conversationId', function () {
          pm.expect(String(pm.response.json().data.id)).to.eql(pm.collectionVariables.get('conversationId'));
      });
    language: text/javascript
order: 3000
