$kind: http-request
url: "{{baseUrl}}/api/v1/auth/email/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Admin login trả 200', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.collectionVariables.set('accessToken', body.data.token);
      pm.collectionVariables.set('refreshToken', body.data.refreshToken);
    language: text/javascript
order: 2000
