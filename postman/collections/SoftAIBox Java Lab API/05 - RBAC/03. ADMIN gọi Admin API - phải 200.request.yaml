$kind: http-request
url: "{{baseUrl}}/api/v1/admin/demo"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('ADMIN được phép với 200', function () { pm.response.to.have.status(200); });
      pm.expect(pm.response.json().data.permission).to.eql('ADMIN_GRANTED');
    language: text/javascript
order: 3000
